name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP tests and source quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs --no-interaction

      - name: Check source encoding
        run: php scripts/check-encoding.php

      - name: Run PHPUnit
        run: php artisan test --compact

  frontend:
    name: Frontend tests and release build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit frontend dependencies
        run: npm audit

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build frontend release
        run: npm run build

  release-integrity:
    name: Verify commit-bound deployment release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and release commits
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify deployment release commit scope
        run: php scripts/verify-release-commit.php

      - name: Verify source and frontend artifact
        run: php scripts/frontend-release.php verify "$(git rev-parse HEAD^)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies for an independent rebuild
        run: npm ci --ignore-scripts --no-fund

      - name: Rebuild frontend from the release source
        run: npm run build

      - name: Compare the committed artifact with the clean rebuild
        run: php scripts/frontend-release.php verify-build "$(git rev-parse HEAD^)"
